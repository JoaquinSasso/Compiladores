<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="description" content="Calculadora de álgebra relacional: traduce a SQL y ejecuta las consultas en el navegador." />
    <meta name="theme-color" content="#2457c5" />
    <title>Álgebra relacional → SQL</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="cargando">
            <span>Cargando la calculadora… <span class="progreso-texto"></span></span>
            <div class="progreso" aria-hidden="true"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- SQLite compilado a WebAssembly (sql.js): ejecuta el SQL que genera el compilador -->
    <script src="lib/sqljs/sql-wasm.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <!-- Aviso cuando hay una versión nueva de la app (la descargó el service worker) -->
    <div id="actualizacion" role="status">
        Hay una versión nueva de la app.
        <button type="button">Actualizar</button>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(registro => {
                const aviso = document.getElementById('actualizacion');
                const avisar = nuevo => {
                    aviso.classList.add('visible');
                    aviso.querySelector('button').onclick = () => nuevo.postMessage('activar');
                };
                if (registro.waiting && navigator.serviceWorker.controller) avisar(registro.waiting);
                registro.addEventListener('updatefound', () => {
                    const nuevo = registro.installing;
                    nuevo.addEventListener('statechange', () => {
                        if (nuevo.state === 'installed' && navigator.serviceWorker.controller) avisar(nuevo);
                    });
                });
            });
            // Cuando el service worker nuevo toma el control, se recarga la página.
            let recargando = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!recargando) { recargando = true; location.reload(); }
            });
        }
    </script>
</body>

</html>
