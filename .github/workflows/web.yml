# Publica la app web (Algebra Relacional/Web) en GitHub Pages en cada push a main.
# Antes corre todas las pruebas: si alguna falla, no se publica.
#
# Para que funcione, en GitHub: Settings → Pages → Source: "GitHub Actions" (una sola vez).
# La app queda en https://<usuario>.github.io/<repositorio>/
name: Publicar la app web

on:
  push:
    branches: [main]
    paths:
      - "Algebra Relacional/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pruebas (compilador y app web)
        working-directory: Algebra Relacional
        run: bash probar.sh

      - name: Publicar la app
        run: dotnet publish "Algebra Relacional/Web" -c Release -o salida

      - name: Adaptar a la subcarpeta de GitHub Pages
        run: python3 "Algebra Relacional/Web/preparar_pages.py" salida/wwwroot "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: salida/wwwroot

      - id: despliegue
        uses: actions/deploy-pages@v4
